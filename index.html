<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客語身體器官</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{
  --bg:#fff7ea; --card:#ffffff; --ink:#3a2f45; --accent:#ff8a5b; --accent2:#5fc7b8;
  --soft:#ffe9d2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent}
.app{max-width:600px;margin:0 auto;padding:10px 12px 14px}
h1{font-size:20px;margin:4px 0 8px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:16px;
  padding:7px 18px;border-radius:999px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 0 #d9683a}
.seg.small{flex-wrap:wrap;justify-content:center;border-radius:18px}
.seg.small button{font-size:14px;padding:5px 12px}
.seg.small button.on{background:var(--accent2);box-shadow:0 2px 0 #3a9e90}
.hint{font-size:14px;text-align:center;color:#7a6a85;margin:2px 0 6px;min-height:20px}
.opts{display:flex;gap:14px;justify-content:center;font-size:14px;margin:4px 0}
.opts label{cursor:pointer;user-select:none}
.stage{position:relative;width:100%;aspect-ratio:500/640;background:
  radial-gradient(circle at 50% 45%,#fff 0,#fff3df 60%,#ffe6c6 100%);
  border-radius:24px;border:3px solid #ffd5a8;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hit{fill:transparent;cursor:pointer;transition:fill .15s}
.hit:hover{fill:rgba(255,138,91,.28)}
.hit.on{fill:rgba(255,138,91,.38);stroke:#ff8a5b;stroke-width:3;stroke-dasharray:7 5;
  animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.lines line{stroke:#ff8a5b;stroke-width:2.5;stroke-linecap:round}
.lines circle{fill:#ff8a5b}
.lines .corr{stroke:transparent;stroke-width:30;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
.chip{position:absolute;width:21.6%;min-width:92px;background:var(--card);border:2.5px solid var(--accent);
  border-radius:14px;padding:5px 6px 6px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 rgba(217,104,58,.35);animation:pop .18s ease-out}
.chip.right{right:.8%} .chip.left{left:.8%}
.chip .zh{display:block;font-size:20px;font-weight:700;line-height:1.25}
.chip .py{display:block;font-size:15px;color:#c2501f;font-weight:700;margin-top:1px;
  font-family:"Noto Sans TC","PingFang TC",sans-serif;letter-spacing:.02em}
.chip .gl{display:block;font-size:13px;color:#7a6a85;margin-top:1px}
.chip .sp{font-size:14px;margin-left:2px}
.chip.pyonly .py{font-size:17px;margin:0}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.char{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.foot{font-size:12px;color:#8a7b94;text-align:center;margin-top:8px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.char,.blink,.hit.on,.chip{animation:none}}
</style>
</head>
<body>
<div class="app">
  <h1>👧 客語身體器官</h1>
  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-mode="learn" class="on">學習</button>
      <button data-mode="answer">解答</button>
    </div>
    <div class="seg small" id="sceneSeg">
      <button data-scene="body" class="on">女孩全身</button>
      <button data-scene="face">女孩臉部</button>
      <button data-scene="boy">男孩</button>
      <button data-scene="arms">男孩手臂</button>
      <button data-scene="hand">男孩的手</button>
      <button data-scene="boyback">男孩背面</button>
    </div>
  </div>
  <div class="bar" id="answerBar" hidden>
    <div class="seg small" id="showSeg">
      <button data-show="zh">客語</button>
      <button data-show="py">音標</button>
      <button data-show="none">全部收起</button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="stage" id="stage">
    <svg id="sceneSvg" viewBox="0 0 500 640"></svg>
    <svg id="lineSvg" class="lines" viewBox="0 0 500 640" style="pointer-events:none"></svg>
    <div id="chips"></div>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="optGl"> 顯示華語</label>
    <label><input type="checkbox" id="optSlow"> 慢速發音</label>
  </div>
  <div class="foot">詞形與拼音:教育部臺灣客語辭典(海陸腔)、客家委員會客語認證詞彙<br>
  語音來源:GoHakka.org(CC BY-SA 4.0)</div>
</div>

const SCENE_ART = {body:BODY_SVG, face:FACE_SVG, boy:BOY_SVG, arms:ARMS_SVG, hand:HAND_SVG, boyback:BOYBACK_SVG};

const state = {mode:"learn", scene:"body", selected:null, revealed:{}, show:"none"};
const $ = s=>document.querySelector(s);
const sceneSvg=$("#sceneSvg"), lineSvg=$("#lineSvg"), chipsEl=$("#chips");

function play(key){
  const src = AUDIO[key]; if(!src) return;
  try{
    if(window._a){window._a.pause();}
    const a = new Audio(src);
    a.playbackRate = $("#optSlow").checked ? 0.7 : 1;
    window._a = a; a.play();
  }catch(e){}
}

function draw(){
  sceneSvg.innerHTML = SCENE_ART[state.scene];
  sceneSvg.querySelectorAll(".hit").forEach(el=>{
    el.addEventListener("pointerenter",e=>{
      if(state.mode!=="learn" || e.pointerType!=="mouse") return;
      clearTimeout(hoverTimer);
      hoverTimer=setTimeout(()=>select(el.dataset.key),260);   // 滑鼠只是經過就不換
    });
    el.addEventListener("pointerleave",()=>clearTimeout(hoverTimer));
    el.addEventListener("click",()=>{ if(state.mode==="learn") select(el.dataset.key); });
  });
  refresh();
}

function select(key){
  if(state.selected===key) return;
  state.selected=key; refresh();
}

function refresh(){
  const cfg = SCENES[state.scene];
  const gl = $("#optGl").checked;
  sceneSvg.querySelectorAll(".hit").forEach(el=>el.classList.toggle("on", state.mode==="learn" && el.dataset.key===state.selected));
  let chips="", lines="";
  Object.keys(cfg).forEach(key=>{
    const c=cfg[key], w=W[key];
    let visible=false, body="";
    if(state.mode==="learn"){
      if(key===state.selected){
        visible=true;
        body = `<span class="zh">${w.zh} <span class="sp">🔊</span></span>`
          + (state.revealed[key] ? `<span class="py">${w.py}</span>` : "")
          + (gl ? `<span class="gl">${w.gl}</span>` : "");
      }
    }else if(state.show==="zh"){
      visible=true; body=`<span class="zh">${w.zh}</span>` + (gl?`<span class="gl">${w.gl}</span>`:"");
    }else if(state.show==="py"){
      visible=true; body=`<span class="py">${w.py}</span>` + (gl?`<span class="gl">${w.gl}</span>`:"");
    }
    if(!visible) return;
    const top = ((c.y-24)/640*100).toFixed(2);
    chips += `<button class="chip ${c.side}${state.mode==="answer"&&state.show==="py"?" pyonly":""}" data-key="${key}" style="top:${top}%">${body}</button>`;
    const x = c.side==="left" ? 112 : 388;
    lines += `<line x1="${x}" y1="${c.y}" x2="${c.ax}" y2="${c.ay}"/><circle cx="${c.ax}" cy="${c.ay}" r="5"/>`;
    if(state.mode==="learn") lines += `<line class="corr" data-key="${key}" x1="${x}" y1="${c.y}" x2="${c.ax}" y2="${c.ay}"/>`;
  });
  chipsEl.innerHTML = chips;
  lineSvg.innerHTML = lines;
  chipsEl.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",ev=>{
    ev.stopPropagation();
    const key=b.dataset.key;
    if(state.mode==="learn"){ state.revealed[key]=true; refresh(); }
    play(key);
  }));
  lineSvg.querySelectorAll(".corr").forEach(l=>l.addEventListener("click",ev=>{
    ev.stopPropagation(); const key=l.dataset.key;
    state.revealed[key]=true; refresh(); play(key);
  }));
  $("#hint").textContent = state.mode==="learn"
    ? (state.selected ? "沿著線移到文字,點一下看拼音並聽發音" : "把滑鼠移到(或用手指點)身體的部位")
    : "選「客語」或「音標」,全部一次顯示;也可以點文字聽發音";
}

// 控制列
$("#modeSeg").addEventListener("click",e=>{
  const m=e.target.dataset.mode; if(!m) return;
  state.mode=m; state.selected=null; state.revealed={}; state.show="none";
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  $("#answerBar").hidden = m!=="answer";
  document.querySelectorAll("#showSeg button").forEach(b=>b.classList.remove("on"));
  refresh();
});
$("#sceneSeg").addEventListener("click",e=>{
  const s=e.target.dataset.scene; if(!s) return;
  state.scene=s; state.selected=null; state.revealed={};
  document.querySelectorAll("#sceneSeg button").forEach(b=>b.classList.toggle("on",b.dataset.scene===s));
  draw();
});
$("#showSeg").addEventListener("click",e=>{
  const s=e.target.dataset.show; if(!s) return;
  state.show=s;
  document.querySelectorAll("#showSeg button").forEach(b=>b.classList.toggle("on",b.dataset.show===s && s!=="none"));
  refresh();
});
$("#optGl").addEventListener("change",refresh);
$("#stage").addEventListener("click",e=>{
  if(state.mode==="learn" && !e.target.classList.contains("hit") && !e.target.closest(".chip")){
    state.selected=null; refresh();
  }
});
draw();
</script>
</body>
</html>
